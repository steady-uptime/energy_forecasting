# configs/model_search.yaml
model_search:
  strategy: grid
  scoring: rmse
  max_trials: 5

  models:
    - name: rf_small
      model_kind: random_forest_regressor
      params:
        n_estimators: 200
        max_depth: 12

    - name: gbm
      model_kind: gradient_boosting
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 4

    - name: xgb
      model_kind: xgboost
      params:
        n_estimators: 400
        max_depth: 8
        learning_rate: 0.05

    - name: lgbm
      model_kind: lightgbm
      params:
        num_leaves: 64
        learning_rate: 0.03
        n_estimators: 300

    - name: elastic_net
      model_kind: elastic_net
      params:
        alpha: 0.1
        l1_ratio: 0.5
